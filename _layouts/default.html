<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <header class="site-header">
    <div class="wrap nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}">万联库<span>内容博客</span></a>
      <nav>
        <a href="{{ '/' | relative_url }}">首页</a>
        <a href="{{ '/about/' | relative_url }}">关于</a>
      </nav>
    </div>
  </header>
  <main class="wrap">{{ content }}</main>
  <footer class="site-footer">
    <div class="wrap">万联库APP · 项目、渠道与合作信息整理</div>
  </footer>
</body>
</html>
